name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Bison regression oracle
        run: sudo apt-get update && sudo apt-get install -y bison
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features codegen -- -D warnings
      - run: cargo test --all-targets --features codegen
      - name: Compare LR automata with Bison
        run: GAZELLE_BISON_REGRESSION=1 cargo test --features codegen lr::tests::bison_canonical_and_ielr_state_counts
